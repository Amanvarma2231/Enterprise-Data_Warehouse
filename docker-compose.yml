version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: retailsphere_postgres
    restart: always
    environment:
      POSTGRES_DB: retailsphere_dw
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/ddl/postgres_schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d retailsphere_dw"]
      interval: 5s
      timeout: 5s
      retries: 5

  dashboard:
    build: .
    container_name: retailsphere_dashboard
    restart: always
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=retailsphere_dw
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgrespassword
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./docs:/app/docs
      - ./logs:/app/logs

volumes:
  pgdata:
