[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "retailsphere-data-warehouse"
version = "1.0.0"
description = "Enterprise Sales & Customer Data Warehouse, Kimball Dimensional Modeling and Data Governance Platform"
authors = [{ name = "Aman Varma", email = "amanvarma.data@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.1.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "faker>=19.0.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.6",
    "pymysql>=1.1.0",
    "pymongo>=4.6.0",
    "openpyxl>=3.1.2",
    "plotly>=5.15.0",
    "streamlit>=1.28.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pydantic>=2.0.0",
    "rich>=13.4.0",
    "dbt-core>=1.6.0",
    "dbt-duckdb>=1.6.0"
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.4.0",
    "isort>=5.12.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
