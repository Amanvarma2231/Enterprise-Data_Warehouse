<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Logo Mark Icon -->
  <g transform="translate(15, 10)">
    <!-- Hexagonal / Diamond Platform Badge -->
    <rect x="5" y="5" width="90" height="90" rx="20" fill="url(#grad1)" filter="url(#shadow)"/>
    
    <!-- Data Warehouse Cube / Layers -->
    <path d="M50 25 L80 40 L50 55 L20 40 Z" fill="#93C5FD" opacity="0.95"/>
    <path d="M20 44 L50 59 L50 82 L20 67 Z" fill="#3B82F6" opacity="0.9"/>
    <path d="M80 44 L50 59 L50 82 L80 67 Z" fill="#1D4ED8" opacity="0.9"/>
    
    <!-- Governance Node Dot -->
    <circle cx="50" cy="55" r="4" fill="#10B981"/>
    <circle cx="50" cy="25" r="3" fill="#FDE047"/>
  </g>

  <!-- Brand Typography -->
  <text x="125" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#0F172A" letter-spacing="-0.5">
    Retail<tspan fill="#2563EB">Sphere</tspan>
  </text>
  
  <text x="127" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#64748B" letter-spacing="1.5">
    ENTERPRISE DATA WAREHOUSE &amp; GOVERNANCE
  </text>
  
  <!-- Live Badge -->
  <rect x="420" y="38" width="65" height="22" rx="11" fill="url(#grad2)"/>
  <circle cx="432" cy="49" r="3.5" fill="#FFFFFF"/>
  <text x="442" y="53" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">LIVE</text>
</svg>
