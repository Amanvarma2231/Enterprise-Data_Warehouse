name: Enterprise Data Warehouse CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  PYTHONDONTWRITEBYTECODE: 1
  PYTHONUNBUFFERED: 1

jobs:
  # ─── Job 1: Lint & Import Checks ───────────────────────────────────────────
  lint:
    name: "Lint & Import Validation"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Lint Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Flake8 Code Quality Check (non-blocking)
        run: |
          flake8 src/ dashboard/ --max-line-length=120 --ignore=E501,W503 --statistics || true

  # ─── Job 2: Full End-to-End Warehouse Pipeline Test ────────────────────────
  build-and-test:
    name: "Validate Data Quality & Warehouse Pipeline"
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies (Cloud-Safe, No Native Builds)
        run: |
          python -m pip install --upgrade pip
          pip install \
            "streamlit>=1.30.0" \
            "plotly>=5.18.0" \
            "openpyxl>=3.1.0" \
            "duckdb>=1.1.0" \
            "pandas>=2.0.0" \
            "numpy>=1.24.0" \
            "SQLAlchemy>=2.0.0" \
            "faker>=30.0.0" \
            "pytest>=8.0.0" \
            "tabulate>=0.9.0" \
            "pyyaml>=6.0.0" \
            "rich>=13.0.0"

      - name: Phase 1 - Generate Synthetic Sample Dataset
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python src/data_generator.py --sample
          echo "Dataset files:"
          ls -lh data/sample/

      - name: Phase 2 - Run Full ETL + DQ + Star Schema Pipeline
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python src/pipeline.py --mode all --sample

      - name: Phase 3 - Run PyTest Suite (All 14 Tests)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests/ -v --tb=short --color=yes

      - name: Phase 4 - Validate Governance & Metadata Artifacts
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python src/pipeline.py --mode profile --sample
          echo "Metadata artifacts:"
          ls -lh metadata/ || true

      - name: Upload Warehouse DB Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retailsphere-warehouse-db
          path: data/warehouse/retailsphere_dw.duckdb
          retention-days: 7

      - name: Upload Logs & Metadata
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-artifacts
          path: |
            metadata/
            logs/
          retention-days: 7
